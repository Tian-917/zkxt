# 职考云专用虚拟主机（与 *.zkxt.com 并行，互不影响）
# 由 /usr/local/src/nginx/conf/nginx.conf 里的 include zkxt.conf; 引入
# 前端产物目录：/usr/local/src/zkxt-portal（学员端）、/usr/local/src/zkxt-admin（管理端，同一套 SPA 的 /admin）

server {
    listen       80;
    server_name  git.zkxt.com;
    location / {
        proxy_pass http://localhost:10880;
    }
}

server {
    listen       80;
    server_name  jenkins.zkxt.com;
    location / {
        proxy_pass http://localhost:18080;
    }
}

server {
    listen       80;
    server_name  nacos.zkxt.com;
    # Nacos 控制台在 /nacos 下，根路径直接跳过去，避免 404
    location = / { return 302 /nacos/; }
    location / {
        proxy_pass http://localhost:8848;
    }
}

server {
    listen       80;
    server_name  xxljob.zkxt.com;
    # 调度中心在 /xxl-job-admin 下
    location = / { return 302 /xxl-job-admin/; }
    location / {
        proxy_pass http://localhost:8880;
    }
}

server {
    listen       80;
    server_name  es.zkxt.com;
    location / {
        proxy_pass http://localhost:5601;
    }
}

server {
    listen       80;
    server_name  mq.zkxt.com;
    location / {
        proxy_pass http://localhost:15672;
    }
}

server {
    listen       80;
    server_name  api.zkxt.com;
    location / {
        proxy_pass http://192.168.150.101:10010;
    }
}

# 学员端（门户）
server {
    listen       80;
    server_name  www.zkxt.com zkxt.com;
    root         /usr/local/src/zkxt-portal;
    index        index.html;
    # index.html 不缓存：每次部署后要能立刻拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
    # 文件名带 hash 的静态资源可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端所有接口都走 /api，这里去掉前缀转给网关
    location /api/ {
        proxy_pass http://192.168.150.101:10010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# 管理端（同一套 SPA，入口在 /admin）
server {
    listen       80;
    server_name  manage.zkxt.com;
    root         /usr/local/src/zkxt-admin;
    index        index.html;
    # index.html 不缓存：每次部署后要能立刻拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
    # 文件名带 hash 的静态资源可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://192.168.150.101:10010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
