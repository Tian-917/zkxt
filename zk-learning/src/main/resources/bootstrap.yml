server:
  port: 8090  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: learning-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
          - data-id: shared-feign.yaml # 共享feign配置
            refresh: false
          - data-id: shared-mq.yaml # 共享mq配置
            refresh: false
          - data-id: shared-xxljob.yaml # 共享xxljob配置
            refresh: false
zk:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.zhikao.learning.controller
    title: 职考云 - 学习中心接口文档
    description: 该服务包含用户学习的各种辅助功能
    contact-name: 职考云·研发组
    contact-url: https://github.com/yourname
    contact-email: dev@example.com
    version: v1.0
  jdbc:
    database: zk_learning
  auth:
    resource:
      enable: true
