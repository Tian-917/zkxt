server:
  port: 8084  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: media-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-feign.yaml # 共享feign配置
            refresh: false
zk:
  swagger:
    enable: true
    package-path: com.zhikao.media.controller
    title: 职考云 - 媒资中心接口文档
    description: 该服务包含图片管理、媒资管理等
    contact-name: 职考云·研发组
    contact-url: https://github.com/yourname
    contact-email: dev@example.com
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /medias/signature/play
  jdbc:
    database: zk_media
  platform:
    # 文件存储：LOCAL = 落本地磁盘（无需云账号）；ALI / TENCENT = 云存储
    file: LOCAL
    media: TENCENT
  local:
    # LOCAL 模式下文件的存放目录（相对服务启动目录）
    upload-dir: ./uploads
  tencent:
    appId: ${TENCENT_APP_ID:}
    secretId: ${TENCENT_SECRET_ID:}
    secretKey: ${TENCENT_SECRET_KEY:}
    vod:
      enable: true
      vodValidSeconds: 7776000
      region: "ap-shanghai"
      procedure: "wisehub-base"
      urlKey: "${TENCENT_VOD_URL_KEY:}"
      pfcg: "basicDrmPreset"
    cos:
      enable: true
      region: "ap-shanghai"
      bucket: wisehub
      multipartUploadThreshold: 5242880 # 5mb，触发分片上传的阈值
      minimumUploadPartSize: 1048576 # 1mb，分片的最小大小
