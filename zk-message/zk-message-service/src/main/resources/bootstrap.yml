server:
  port: 8085  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: message-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
          - data-id: shared-feign.yaml # 共享feign配置
            refresh: false
          - data-id: shared-mq.yaml # 共享mq配置
          - data-id: shared-xxljob.yaml # 共享xxl-job配置（否则 publishNoticeJob 的执行器不会注册）
            refresh: false
zk:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.zhikao.message.controller
    title: 职考云 - 消息中心接口文档
    description: 该服务用于站内信、通知管理、短信发送等功能
    contact-name: 职考云·研发组
    contact-url: https://github.com/yourname
    contact-email: dev@example.com
    version: v1.0
  auth:
    resource:
      enable: true
      # 只对"我的消息"做登录校验，其它接口（短信/模板/第三方回调）保持开放
      includeLoginPaths:
        - /inboxes/**
      excludeLoginPaths:
        - /students/register
        - /users/detail/{isStaff}
        - /users/list
        - GET:/users/{id}
        - /users/{id}/type
        - /users/ids
  jdbc:
    database: zk_message
  sms:
    ali:
      accessId: ${SMS_ACCESS_ID:}
      accessSecret: ${SMS_ACCESS_SECRET:}
