server:
  port: 8087  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
  error:
    include-message: always #返回的响应体带上message
spring:
  profiles:
    active: dev
  application:
    name: pay-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - dataId: shared-spring.yaml # 共享spring配置
          - dataId: shared-redis.yaml # 共享redis配置
          - dataId: shared-mybatis.yaml # 共享mybatis配置
          - dataId: shared-logs.yaml # 共享日志配置
          - dataId: shared-feign.yaml # 共享feign配置
          - dataId: shared-mq.yaml # 共享mq配置
          - dataId: shared-xxljob.yaml # 共享mq配置
zk:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.zhikao.pay.controller
    title: 职考云 - 支付中心接口文档
    description: 该服务提供微信、支付宝等各种平台的支付、退款等功能
    contact-name: 职考云·研发组
    contact-url: https://github.com/yourname
    contact-email: dev@example.com
    version: v1.0
  jdbc:
    database: zk_pay
  pay:
    notifyHost: ${PAY_NOTIFY_HOST:http://localhost:8087/ps}
    ali:
      appId: "${ALIPAY_APP_ID:}"
      merchantPrivateKey: "${ALIPAY_MERCHANT_PRIVATE_KEY:}"
      publicKey: "${ALIPAY_PUBLIC_KEY:}"
    wx:
      appId: "${WXPAY_APP_ID:}"
      mchId: "${WXPAY_MCH_ID:}"
      mchSerialNo: "${WXPAY_MCH_SERIAL_NO:}"
      privateKey: "${WXPAY_PRIVATE_KEY:}"
      apiV3Key: "${WXPAY_API_V3_KEY:}"
